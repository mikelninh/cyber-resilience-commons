name: Deploy public app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify before deploy
        run: npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke public simulator and tabletop drill
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"

          fetch_until_ready() {
            local url="$1"
            local marker="$2"
            local body
            body="$(mktemp)"
            for attempt in $(seq 1 36); do
              code="$(curl --location --silent --show-error --max-time 20 --output "$body" --write-out '%{http_code}' "$url" || true)"
              if [ "$code" = "200" ] && grep -Fq "$marker" "$body"; then
                echo "LIVE PASS: $url"
                rm -f "$body"
                return 0
              fi
              echo "Waiting for Pages propagation ($attempt/36): $url returned $code"
              sleep 5
            done
            echo "LIVE FAIL: $url"
            head -80 "$body" || true
            rm -f "$body"
            return 1
          }

          fetch_until_ready "$base/" "See how far an incident can spread"
          fetch_until_ready "$base/tabletop.html" "Practice the decisions before the pressure is real"
