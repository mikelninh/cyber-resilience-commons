name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run deterministic golden cases
        run: npm test
      - name: Verify public safety markers
        run: |
          grep -Fq "No real systems are scanned or attacked" index.html
          grep -Fq "explicitly authorized" simulator.js
          grep -Fq "not a penetration test" README.md
