name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run deterministic golden cases
        run: npm test
      - name: Verify public safety markers
        run: |
          grep -Fiq "No real systems are scanned or attacked" index.html
          grep -Fiq "explicitly authorized" simulator.js
          grep -Fiq "not a penetration test" README.md
          grep -Fiq "synthetic tabletop exercise" drill.js
          grep -Fiq "Nothing is sent to a server" tabletop.html
          grep -Fiq "no scanning" map.html
          grep -Fiq "not a vulnerability scan" dependency-map.js
